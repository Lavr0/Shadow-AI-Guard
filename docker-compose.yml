services:
  db:
    image: postgres:15-alpine
    container_name: shadow-postgres
    environment:
      POSTGRES_DB: shadow_ai_db
      POSTGRES_USER: shadow_user
      POSTGRES_PASSWORD: shadow_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadow_user -d shadow_ai_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  app:
    build: .
    container_name: shadow-guard-app
    command: mitmdump -s shadow_proxy.py --set block_global=false --listen-host 0.0.0.0 --listen-port 8080 --ssl-insecure
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_NAME=shadow_ai_db
      - DB_USER=shadow_user
      - DB_PASSWORD=shadow_password
      - DB_PORT=5432
    volumes:
      - .:/app
      - ./.mitmproxy:/root/.mitmproxy
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  postgres_data: